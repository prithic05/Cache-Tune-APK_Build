version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cachetune_backend
    ports:
      - "8000:8000"
    volumes:
      - ./cache:/app/cache
      - ./downloads:/app/downloads
      - ./Downloader:/app/Downloader
      - ./yt-music:/app/yt-music
      - ./backend:/app/backend
      - ./apple_music_search:/app/apple_music_search
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=sqlite:///./backend/cachetune.db

  wrapper:
    image: ghcr.io/worldobservationlog/wrapper:local
    container_name: cachetune_wrapper
    privileged: true
    restart: unless-stopped
    ports:
      - "10020:10020"
      - "20020:20020"
      - "30020:30020"
